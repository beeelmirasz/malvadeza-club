<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malvadeza Club</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TELA INICIAL -->
  <div id="telaInicial" class="tela-inicial">
    <h1>😈 MALVADEZA CLUB 💋</h1>
    <p>A noite começa quando você decide entrar...</p>

    <button onclick="entrarNoClub()">🔥 ENTRAR NA MALVADEZA 🔥</button>
  </div>
  <iframe id="musica"
  style="border-radius:12px; margin-top: 25px;"
  src="https://open.spotify.com/embed/track/6LjKiYjn0GyxjyGdvmQGvO"
  width="500"
  height="152"
  frameborder="0"
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
  loading="lazy">
</iframe>

  <!-- SEU CHAT COMEÇA AQUI -->

  <div class="chat-container">
    <h2>😈 MALVADEZA CLUB 💋</h2>
<p>Onde elas mandam, eles atendem.</p>

    <div id="historico" class="historico">
      <p class="bot">
       <p class="bot">
  💋 Mami: Oi, gata 😈 Eu sou a Mami, sua anfitriã na Malvadeza Club.
  Aqui você não corre atrás... você escolhe. 💅🩷
  <br><br>
  Me diz, o que você quer saber?
</p>
      </p>
    </div>

    <div class="entrada">
      <input 
        type="text" 
        id="mensagem" 
        placeholder="Digite sua mensagem..."
      >

      <button onclick="enviarMensagem()">Enviar</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
